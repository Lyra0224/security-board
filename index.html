<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安保卫士｜华东安保一部·监察看板</title>
  <meta name="description" content="华东安保一部一屏式运营监察大屏：稽核、人力、岗位、专案、设备、事项、培训七大板块">
  <style>
    :root {
      color-scheme: dark;
      --bg:#04070f; --bg2:#0a1122;
      --pnl:rgba(13,20,38,.86); --pnl2:rgba(16,24,46,.72);
      --line:rgba(111,151,255,.12); --line2:rgba(111,151,255,.22);
      --a1:#7ba8ff; --a2:#3af5b4; --warn:#ffc06a; --danger:#ff5c7d;
      --text:#f2f5ff; --muted:#93a5c4; --faint:#6d7d9680;
      --accent:#6f97ff; --accent-rgb:111,151,255;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(123,168,255,.18), transparent 60%),
        radial-gradient(760px 420px at 96% 108%, rgba(58,245,180,.11), transparent 55%),
        radial-gradient(600px 300px at 50% 120%, rgba(123,168,255,.07), transparent 60%),
        radial-gradient(rgba(123,168,255,.09) 1px, transparent 1.2px),
        linear-gradient(155deg,#050912 0%,#081021 55%,#040a16 100%);
      background-size:auto,auto,26px 26px,auto;
      color:var(--text); min-width:320px; padding:clamp(8px,1vw,16px); overflow-x:hidden;
      font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
      background:linear-gradient(115deg,transparent 42%,rgba(111,151,255,.05) 50%,transparent 58%);
      background-size:260% 100%; animation:none; opacity:.5; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; background:none; border:none; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--a1); outline-offset:2px; }
    h1,h2,h3,p { margin:0; }
    .shell { max-width:2260px; margin:0 auto; min-height:calc(100vh - clamp(16px,2vw,32px));
      display:grid; grid-template-rows:66px 46px minmax(0,1fr) 160px; gap:10px; }
    /* ===== 面板 ===== */
    .pnl { position:relative; border:1px solid var(--line); border-radius:10px; background:linear-gradient(180deg,rgba(15,23,44,.92),rgba(9,14,29,.9)); overflow:hidden; }
    .pnl::before { content:""; position:absolute; left:0; right:0; top:0; height:1px;
      background:linear-gradient(90deg,rgba(123,168,255,.4),rgba(58,245,180,.22) 45%,transparent 80%); }
    .pnl-body { padding:10px 12px 12px; }
    .pnl-head { display:flex; align-items:center; gap:8px; padding:9px 12px 0; }
    .pmark { width:7px; height:7px; transform:rotate(45deg); background:linear-gradient(135deg,var(--a1),var(--a2)); flex:0 0 auto; box-shadow:0 0 6px rgba(123,168,255,.5); }
    .pnl-head h3 { font-size:12.5px; letter-spacing:.06em; white-space:nowrap; }
    .pnl-head .pno { font-size:9px; color:var(--faint); font-weight:700; letter-spacing:.18em; }
    .pnl-head .ptag { margin-left:auto; color:var(--muted); font-size:9px; white-space:nowrap; }
    /* ===== 顶栏 ===== */
    .topbar { display:grid; grid-template-columns:minmax(400px,1.18fr) minmax(520px,1.9fr); gap:10px; }
    .brand { display:flex; align-items:center; gap:11px; padding:0 14px; min-width:0; }
    .brand-copy { min-width:0; flex:1; }
    .brand-mark { width:50px; height:54px; position:relative; display:grid; place-items:center; flex:0 0 auto; }
    .brand-mark img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 0 8px rgba(123,168,255,.4)) drop-shadow(0 0 5px rgba(58,245,180,.22)); }
    .brand-mark::after { content:""; position:absolute; inset:-3px; border:1px dashed rgba(111,151,255,.28); border-radius:50%; }
    .brand-mark::before { content:""; position:absolute; inset:-8px; border-radius:50%; background:radial-gradient(circle,rgba(111,151,255,.14),transparent 68%); z-index:-1; }
    .brand h1 { font-size:clamp(18px,1.3vw,28px); letter-spacing:.04em; white-space:nowrap; overflow:visible;
      background:linear-gradient(92deg,#f4f8ff,#9dbdff 55%,#3af5b4); -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 0 14px rgba(123,168,255,.4)); }
    .brand-sub { margin-top:3px; color:var(--muted); font-size:10.5px; letter-spacing:.06em; display:flex; align-items:center; gap:7px; white-space:nowrap; overflow:hidden; }
    .brand-sub .bsep { color:#4a5875; margin:0 1px; }
    .dot { width:6px; height:6px; border-radius:50%; background:var(--a2); box-shadow:0 0 9px var(--a2); flex:0 0 auto; }
    .brand-tools { display:flex; gap:6px; align-items:center; flex:0 0 auto; }
    .chip { border:1px solid var(--line2); border-radius:999px; padding:4px 10px; font-size:10.5px; color:#a7bcf5; background:rgba(111,151,255,.07); white-space:nowrap; }
    .chip.time { color:#93a8c9; border-color:rgba(130,148,179,.25); font-variant-numeric:tabular-nums; }
    .btn { border:1px solid var(--line2); border-radius:7px; padding:5px 11px; font-size:10.5px; color:#cfe0ff; background:rgba(111,151,255,.09); transition:.2s; white-space:nowrap; }
    .btn:hover { background:rgba(111,151,255,.18); border-color:var(--a1); }
    .btn.hot { border-color:rgba(255,77,109,.45); background:rgba(255,77,109,.12); color:#ffd7de; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); }
    .kpi { position:relative; display:flex; align-items:center; gap:11px; padding:0 15px; background:rgba(12,19,37,.6); transition:.25s; }
    .kpi + .kpi { border-left:1px solid rgba(111,151,255,.12); }
    .kpi:hover, .kpi.linked { background:rgba(111,151,255,.11); }
    .kpi.linked::after { content:""; position:absolute; left:12%; right:12%; bottom:6px; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--a1),var(--a2)); }
    .kpi-ic { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:15px; color:var(--a1); background:rgba(111,151,255,.1); border:1px solid rgba(111,151,255,.2); flex:0 0 auto; }
    .kpi-label { color:var(--muted); font-size:10px; white-space:nowrap; }
    .kpi-value { font-size:clamp(17px,1.25vw,24px); font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; text-shadow:none; }
    .kpi-value small { font-size:10px; color:var(--muted); font-weight:400; margin-left:2px; }
    .kpi-note { color:var(--faint); font-size:9px; margin-top:1px; white-space:nowrap; }

    /* ===== Tab栏 ===== */
    .tabbar { display:flex; align-items:center; gap:9px; padding:0 10px; }
    .tabbar-label { color:#93a8c9; font-size:10.5px; letter-spacing:.16em; white-space:nowrap; padding-left:5px; }
    .dtabs { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; flex:1; min-width:0; }
    .dtab { position:relative; display:flex; align-items:center; gap:7px; padding:7px 10px; border-radius:8px; border:1px solid rgba(111,151,255,.13);
      color:#8294b3; background:rgba(12,19,37,.55); font-size:11px; white-space:nowrap; overflow:hidden; transition:.22s; }
    .dtab .tdot { width:6px; height:6px; border-radius:50%; background:#44557a; flex:0 0 auto; transition:.22s; }
    .dtab:hover { color:var(--text); border-color:var(--line2); transform:translateY(-1px); }
    .dtab.active { color:#fff; border-color:rgba(123,168,255,.65); background:linear-gradient(120deg,rgba(123,168,255,.24),rgba(58,245,180,.1)); box-shadow:0 4px 14px rgba(123,168,255,.14); }
    .dtab.active .tdot { background:var(--a2); box-shadow:0 0 8px var(--a2); }
    .dtab .tno { font-size:9px; color:var(--faint); font-weight:700; }
    .dtab.active .tno { color:#9db5f0; }
    .ap-ctl { display:flex; align-items:center; gap:7px; }
    .ibtn { width:30px; height:30px; border-radius:7px; border:1px solid var(--line2); background:rgba(111,151,255,.08); display:grid; place-items:center; color:#cfe0ff; font-size:11px; }
    .ibtn:hover { background:rgba(111,151,255,.17); }
    .apbar { width:60px; height:3px; border-radius:99px; background:#131e35; overflow:hidden; }
    .apbar span { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--a1),var(--a2)); }
    .apbar.run span { animation:ap 12s linear infinite; }
    /* ===== 工作区 ===== */
    .ws { display:grid; grid-template-columns:minmax(206px,.72fr) minmax(640px,2.6fr) minmax(300px,1.05fr); gap:10px; min-height:0; }
    .navcol { display:flex; flex-direction:column; min-height:0; }
    .navcol .pnl-body { padding:9px 9px 10px; display:flex; flex-direction:column; gap:5px; flex:1; min-height:0; }
    .nav-sum { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:2px; }
    .nstat { padding:6px 8px; border:1px solid rgba(111,151,255,.12); border-radius:7px; background:rgba(10,17,33,.6); }
    .nstat span { display:block; color:var(--muted); font-size:9px; }
    .nstat b { font-size:13px; letter-spacing:.02em; }
    .navlist { display:flex; flex-direction:column; gap:5px; flex:1; min-height:0; }
    .navitem { position:relative; display:grid; grid-template-columns:28px 1fr auto; align-items:center; gap:8px; width:100%; text-align:left;
      padding:7px 9px; border-radius:8px; border:1px solid rgba(111,151,255,.11); background:rgba(10,17,33,.55); color:#8294b3; overflow:hidden; transition:.22s; }
    .navitem:hover { color:var(--text); border-color:var(--line2); }
    .navitem.active { color:#fff; border-color:rgba(123,168,255,.6); background:linear-gradient(100deg,rgba(123,168,255,.2),rgba(58,245,180,.07)); box-shadow:0 0 10px rgba(123,168,255,.1); }
    .navitem.active::before { content:""; position:absolute; left:0; top:16%; bottom:16%; width:3px; border-radius:3px; background:linear-gradient(var(--a1),var(--a2)); }
    .navitem .nic { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; font-size:14px; color:var(--a1); background:rgba(111,151,255,.09); border:1px solid rgba(111,151,255,.16); }
    .navitem .nn { font-size:11.5px; font-weight:600; }
    .navitem .nm { font-size:8.5px; color:var(--faint); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .navitem .nv { text-align:right; font-size:9px; color:#7f93b5; }
    .navitem .nv b { display:block; font-size:12px; color:var(--a2); font-variant-numeric:tabular-nums; }
    .nav-flow { margin-top:auto; padding-top:7px; }
    .nav-flow .fline { height:2px; border-radius:2px; background:linear-gradient(90deg,transparent,var(--a1),var(--a2),transparent); background-size:200% 100%; animation:flow 3s linear infinite; opacity:.6; }
    .nav-flow .ftext { display:flex; justify-content:space-between; color:var(--faint); font-size:8px; margin-top:4px; }
    /* ===== 中列 ===== */
    .maincol { display:flex; flex-direction:column; gap:10px; min-height:0; min-width:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#1b2b4a transparent; padding-right:2px; }
    .maincol::-webkit-scrollbar { width:4px; } .maincol::-webkit-scrollbar-thumb { background:#1b2b4a; border-radius:4px; }
    .maincol .pnl { display:flex; flex-direction:column; min-height:0; flex:0 0 auto; }
    .maincol .pnl.grow { flex:1 1 auto; min-height:148px; }
    .maincol .pnl.hauto { flex:0 0 auto; }
    .pnl-body.fill { flex:1; min-height:0; display:flex; flex-direction:column; }
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:7px; }
    .tile { padding:8px 9px; border:1px solid rgba(111,151,255,.13); border-radius:8px; background:rgba(10,17,33,.55); }
    .tile .tl { color:var(--muted); font-size:9px; white-space:nowrap; }
    .tile .tv { font-size:clamp(16px,1.2vw,22px); font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; text-shadow:none; }
    .tile .tv small { font-size:9.5px; color:var(--muted); font-weight:400; }
    .tile .ts { font-size:8.5px; color:var(--faint); margin-top:2px; white-space:nowrap; }
    .tone-danger { color:var(--danger); } .tone-warn { color:var(--warn); } .tone-good { color:var(--a2); } .tone-a1 { color:var(--a1); }
    .tile.hot { border-color:rgba(255,77,109,.35); background:rgba(255,77,109,.06); }
    .bar-row { display:grid; grid-template-columns:minmax(64px,auto) 1fr auto; gap:8px; align-items:center; }
    .bar-row + .bar-row { margin-top:6px; }
    .bar-name { color:#aebdd8; font-size:10px; white-space:nowrap; }
    .bar-track { height:6px; border-radius:99px; background:#101a30; overflow:hidden; }
    .bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--a1),#9db5f0); box-shadow:none; }
    .bar-fill.g { box-shadow:none; }
    .bar-fill.r { box-shadow:none; }
    .bar-fill.w { box-shadow:none; }
    .bar-fill.g { background:linear-gradient(90deg,#1fb986,var(--a2)); }
    .bar-fill.w { background:linear-gradient(90deg,#c97a2c,var(--warn)); }
    .bar-fill.r { background:linear-gradient(90deg,#d13a58,var(--danger)); }
    .bar-val { color:var(--muted); font-size:9.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .crawl { overflow:hidden auto; scrollbar-width:thin; scrollbar-color:#1b2b4a transparent; max-height:300px; }
    .crawl.fill { max-height:252px; }
    .crawl::-webkit-scrollbar { width:4px; } .crawl::-webkit-scrollbar-thumb { background:#1b2b4a; border-radius:4px; }
    .rec { display:grid; grid-template-columns:34px 40px 1fr auto; gap:8px; align-items:center; padding:5.5px 8px; border-radius:7px; border:1px solid rgba(111,151,255,.1); background:rgba(10,17,33,.5); }
    .rec + .rec { margin-top:5px; }
    .rec .rt { color:var(--a1); font-size:9.5px; font-variant-numeric:tabular-nums; }
    .rec .rr { font-size:9px; padding:1px 6px; border-radius:99px; border:1px solid; white-space:nowrap; }
    .rr.r-h { color:var(--danger); border-color:rgba(255,77,109,.4); background:rgba(255,77,109,.08); }
    .rr.r-m { color:var(--warn); border-color:rgba(255,180,84,.4); background:rgba(255,180,84,.07); }
    .rr.r-l { color:#7f9dc4; border-color:rgba(127,157,196,.35); background:rgba(127,157,196,.06); }
    .rec .rd { font-size:10px; color:#c3d1e8; min-width:0; }
    .rec .rd b { color:#fff; font-weight:600; }
    .rec .rd span { color:var(--faint); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; min-height:0; }
    .mini-tbl { width:100%; border-collapse:collapse; font-size:10px; }
    .mini-tbl th { color:var(--muted); font-weight:500; text-align:left; padding:4px 6px; border-bottom:1px solid rgba(111,151,255,.14); white-space:nowrap; }
    .mini-tbl td { padding:5px 6px; color:#c3d1e8; border-bottom:1px solid rgba(111,151,255,.07); }
    .mini-tbl tr:last-child td { border-bottom:none; }
    .mini-tbl td b { color:#fff; }
    .stag { padding:1px 7px; border-radius:99px; font-size:9px; border:1px solid; white-space:nowrap; }
    .stag.s-run { color:var(--a2); border-color:rgba(46,230,168,.4); background:rgba(46,230,168,.07); }
    .stag.s-warn { color:var(--warn); border-color:rgba(255,180,84,.4); background:rgba(255,180,84,.07); }
    .stag.s-pause { color:#8b97b5; border-color:rgba(139,151,181,.4); }
    .stag.s-done { color:var(--a1); border-color:rgba(111,151,255,.4); }
    .donut-wrap { display:flex; align-items:center; gap:14px; }
    .donut { width:108px; height:108px; border-radius:50%; position:relative; display:grid; place-items:center; flex:0 0 auto; }
    .donut::before { content:""; position:absolute; inset:9px; border-radius:50%; background:#0a1122; }
    .donut .dc { position:relative; z-index:1; text-align:center; }
    .donut .dc b { display:block; font-size:20px; }
    .donut .dc span { font-size:8.5px; color:var(--muted); }
    .legend { display:grid; gap:6px; flex:1; min-width:0; }
    .lg { display:grid; grid-template-columns:9px 1fr auto; gap:7px; align-items:center; color:#aebdd8; font-size:10.5px; }
    .lg i { width:9px; height:9px; border-radius:3px; }
    .lg b { color:#fff; font-variant-numeric:tabular-nums; }
    canvas { display:block; width:100%; height:100%; }
    .chart-wrap { flex:1; min-height:84px; position:relative; }
    .clegend { display:flex; gap:12px; color:var(--muted); font-size:8.5px; }
    .clegend span::before { content:""; display:inline-block; width:13px; height:2px; margin:0 4px 2px 0; background:var(--a1); }
    .clegend span.f::before { background:var(--a2); border-top:1.5px dashed #04070f; }
    .cause-list { display:grid; gap:8px; }
    .cause-top { display:flex; justify-content:space-between; gap:8px; color:#bccbe4; font-size:10px; }
    .cause-top b { color:var(--danger); }
    .cause-src { color:var(--faint); font-size:8.5px; margin-top:2px; }
    .rel-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .rel-node { padding:4px 9px; border-radius:6px; font-size:9.5px; color:#a9c4f5; background:rgba(111,151,255,.08); border:1px solid rgba(111,151,255,.2); }
    .rel-arrow { color:var(--a2); font-size:11px; }
    .sim-card { display:grid; grid-template-columns:52px 1fr; gap:10px; padding:8px; border-radius:8px; border:1px solid rgba(46,230,168,.25); background:rgba(46,230,168,.05); }
    .sim-score { display:grid; place-items:center; border-right:1px solid rgba(46,230,168,.2); color:var(--a2); font-weight:800; font-size:16px; }
    .sim-score small { display:block; font-size:8px; color:var(--muted); font-weight:400; }
    .sim-copy { color:#9fb2cc; font-size:9.5px; line-height:1.5; }
    .sim-copy b { display:block; color:#eaf6ff; font-size:10px; }
    .ai-note { padding:8px 10px; border-left:3px solid; border-radius:0 8px 8px 0; font-size:10px; line-height:1.55; color:#b7c6e0; }
    .ai-note.v { border-color:var(--a1); background:rgba(111,151,255,.06); }
    .ai-note.g { border-color:var(--a2); background:rgba(46,230,168,.05); }
    .ai-note.w { border-color:var(--warn); background:rgba(255,180,84,.05); }
    .img-wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:7px; }
    .img-card { position:relative; border-radius:8px; overflow:hidden; border:1px solid rgba(111,151,255,.18); aspect-ratio:4/3; background:#0a1122; }
    .img-card img { width:100%; height:100%; object-fit:cover; display:block; }
    .img-card .cap { position:absolute; left:0; right:0; bottom:0; padding:3px 6px; font-size:8.5px; color:#dce8ff; background:linear-gradient(transparent,rgba(4,7,15,.85)); }
    .img-add { display:grid; place-items:center; gap:4px; border:1.5px dashed rgba(111,151,255,.35); border-radius:8px; aspect-ratio:4/3; color:var(--muted); font-size:10px; transition:.2s; }
    .img-add:hover { color:var(--a1); border-color:var(--a1); background:rgba(111,151,255,.05); }
    .img-add b { font-size:20px; font-weight:400; }
    /* ===== 右列 ===== */
    .aicol { display:flex; flex-direction:column; gap:10px; min-height:0; min-width:0; }
    .aicol .pnl { display:flex; flex-direction:column; min-height:0; }
    .ai-hero { display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center; }
    .ai-score-ring { width:88px; height:88px; border-radius:50%; position:relative; display:grid; place-items:center; }
    .ai-score-ring::before { content:""; position:absolute; inset:7px; border-radius:50%; background:#0a1122; }
    .ai-score-ring .sc { position:relative; z-index:1; text-align:center; }
    .ai-score-ring .sc b { display:block; font-size:23px; }
    .ai-score-ring .sc span { font-size:8px; color:var(--muted); }
    .ai-hero-copy .h4 { font-size:12.5px; font-weight:700; letter-spacing:.04em; }
    .ai-hero-copy p { margin-top:4px; color:#9fb2cc; font-size:10px; line-height:1.6; }
    .alert-list { display:flex; flex-direction:column; gap:6px; flex:1; min-height:0; overflow:auto; scrollbar-width:thin; }
    .alert { display:grid; grid-template-columns:auto 1fr; gap:8px; padding:7px 8px; border-radius:8px; border:1px solid rgba(111,151,255,.12); background:rgba(10,17,33,.55); }
    .alert .alv { font-size:8.5px; font-weight:800; padding:2px 6px; border-radius:5px; height:fit-content; white-space:nowrap; }
    .alv.lv-r { color:#ffd7de; background:rgba(255,77,109,.16); border:1px solid rgba(255,77,109,.4); }
    .alv.lv-w { color:#ffe3bd; background:rgba(255,180,84,.13); border:1px solid rgba(255,180,84,.4); }
    .alv.lv-b { color:#c9d8ff; background:rgba(111,151,255,.13); border:1px solid rgba(111,151,255,.4); }
    .alv.lv-g { color:#c8ffe9; background:rgba(46,230,168,.12); border:1px solid rgba(46,230,168,.4); }
    .alert .at { font-size:10.5px; color:#e7edfb; font-weight:600; }
    .alert .ac { font-size:9.5px; color:#8fa2c0; margin-top:2px; line-height:1.45; }
    /* ===== 底部 ===== */
    .bottom { display:grid; grid-template-columns:1.45fr 1fr; gap:10px; min-height:0; }
    .caps { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
    .cap { padding:6px 4px; border-radius:7px; border:1px solid rgba(111,151,255,.12); background:rgba(10,17,33,.55); color:#8294b3; font-size:9px; text-align:center; transition:.2s; white-space:nowrap; }
    .cap:hover, .cap.active { color:#fff; border-color:rgba(111,151,255,.45); background:rgba(111,151,255,.12); transform:translateY(-1px); }
    .cap i { display:block; color:var(--a1); font-style:normal; font-size:13px; margin-bottom:2px; }
    .cap.active i { color:var(--a2); }
    .cap-detail { margin-top:7px; padding:6px 9px; border-left:3px solid var(--a2); background:rgba(46,230,168,.045); border-radius:0 7px 7px 0; color:#9fb2cc; font-size:9.5px; line-height:1.5; min-height:34px; }
    .cap-detail b { color:#eaf6ff; }
    .closure-flow { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
    .cl-step { position:relative; text-align:center; padding:6px 2px; border-radius:7px; border:1px solid rgba(111,151,255,.12); background:rgba(10,17,33,.55); color:#6d7f9e; font-size:9px; }
    .cl-step:not(:last-child)::after { content:"›"; position:absolute; right:-6px; top:4px; color:#3a4c6c; z-index:2; font-size:11px; }
    .cl-step.on { color:#c9ffe9; border-color:rgba(46,230,168,.35); background:rgba(46,230,168,.07); }
    .cl-step b { display:block; font-size:11px; margin-bottom:1px; }
    .cl-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:7px; }
    .dri-row { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
    .dri { padding:3px 8px; border-radius:99px; font-size:9px; color:#a9c4f5; border:1px solid rgba(111,151,255,.2); background:rgba(111,151,255,.06); white-space:nowrap; }
    .dri b { color:#fff; font-weight:600; }
    /* ===== 编辑器 ===== */
    .ovl { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(2,5,12,.72); backdrop-filter:blur(5px); padding:18px; }
    .ovl.open { display:flex; }
    .modal { width:min(1100px,96vw); max-height:calc(100vh - 56px); display:flex; flex-direction:column; border:1px solid var(--line2); border-radius:12px;
      background:linear-gradient(165deg,rgba(14,22,42,.985),rgba(7,11,22,.985)); box-shadow:0 26px 80px rgba(0,0,0,.6); overflow:hidden; }
    .m-head { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
    .m-head h2 { font-size:15px; }
    .m-head .sub { color:var(--muted); font-size:10px; margin-top:2px; }
    .m-head .ibtn { margin-left:auto; }
    .m-body { display:grid; grid-template-columns:196px 1fr; min-height:0; flex:1; }
    .m-nav { border-right:1px solid var(--line); padding:10px; overflow:auto; display:grid; gap:4px; align-content:start; }
    .m-nav button { text-align:left; padding:7px 10px; border-radius:7px; color:#8fa2c0; font-size:11px; border:1px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .m-nav button:hover { color:var(--text); border-color:var(--line2); }
    .m-nav button.active { color:#fff; border-color:rgba(111,151,255,.45); background:rgba(111,151,255,.12); }
    .m-form { padding:13px 15px; overflow:auto; display:grid; gap:12px; align-content:start; }
    .fgrp { border:1px solid rgba(111,151,255,.14); border-radius:9px; padding:10px; display:grid; gap:8px; }
    .fgrp .ft { color:var(--a1); font-size:10px; letter-spacing:.1em; }
    .fgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:8px; }
    .fitem { border:1px dashed rgba(111,151,255,.24); border-radius:8px; padding:8px; display:grid; gap:6px; }
    .fitem .ft2 { color:#9fb2cc; font-size:9px; }
    .fitem .fgrid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
    .flist { display:grid; gap:8px; }
    .fi { display:grid; gap:3px; min-width:0; }
    .fi > span { color:var(--muted); font-size:9px; }
    .fi input,.fi select,.fi textarea { width:100%; padding:6px 8px; border-radius:6px; border:1px solid rgba(111,151,255,.24); background:rgba(6,11,24,.9); color:var(--text); font-size:11px; }
    .fi input:focus,.fi select:focus,.fi textarea:focus { border-color:var(--a1); outline:none; }
    .fi textarea { resize:vertical; min-height:40px; }
    .fi.ck { display:flex; align-items:center; gap:6px; }
    .fi.ck input { width:auto; }
    .del-item { position:absolute; right:6px; top:6px; width:20px; height:20px; border-radius:5px; border:1px solid rgba(255,77,109,.4); color:#ff8ba0; font-size:10px; display:grid; place-items:center; background:rgba(255,77,109,.08); }
    .del-item:hover { background:rgba(255,77,109,.2); }
    .m-foot { display:flex; gap:8px; padding:11px 16px; border-top:1px solid var(--line); align-items:center; flex-wrap:wrap; }
    .m-foot .hint { color:var(--faint); font-size:9px; margin-right:auto; }
    .m-foot .btn { padding:8px 13px; }
    .toast { position:fixed; left:50%; bottom:22px; z-index:70; max-width:min(560px,calc(100vw - 28px)); padding:10px 15px; border-radius:9px;
      border:1px solid rgba(111,151,255,.45); color:#e9f0ff; background:rgba(8,13,28,.97); box-shadow:0 18px 55px rgba(0,0,0,.55);
      font-size:11.5px; transform:translate(-50%,18px); opacity:0; pointer-events:none; transition:.25s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes beam { to { background-position:-260% 0; } }
    @keyframes flow { to { background-position:-200% 0; } }
    @keyframes ap { from { width:0; } to { width:100%; } }
    @media (min-width:1401px) and (min-height:840px) { body { height:100vh; overflow:hidden; } .shell { height:calc(100vh - clamp(16px,2vw,32px)); } }
    @media (max-width:1400px) {
      .shell { grid-template-rows:60px 42px minmax(520px,1fr) 150px; gap:8px; }
      .topbar,.ws,.bottom { gap:8px; }
      .ws { grid-template-columns:186px minmax(520px,2.5fr) minmax(272px,1fr); }
      .brand { padding:0 9px; gap:8px; } .brand-mark { width:40px; height:40px; } .brand-mark::after { inset:-2px; } .brand-mark::before { inset:-5px; }
      .kpi { padding:0 10px; gap:8px; } .kpi-ic { display:none; }
      .kpis { grid-template-columns:repeat(4,1fr); }
      .dtab { padding:6px 7px; font-size:10px; gap:5px; }
      .navitem { padding:6px 7px; }
    }
    @media (max-width:1120px) {
      body { overflow:auto; }
      .shell { display:block; }
      .shell > * { margin-bottom:9px; }
      .topbar { grid-template-columns:1fr; }
      .ws { grid-template-columns:186px minmax(480px,1fr); }
      .aicol { grid-column:1/-1; }
      .bottom { grid-template-columns:1fr; }
      .maincol { min-height:620px; }
      .tabbar { overflow-x:auto; } .dtabs { min-width:820px; }
    }
    @media (max-width:780px) {
      .ws { display:block; } .ws > * { margin-bottom:9px; }
      .grid2 { grid-template-columns:1fr; }
      .kpis { grid-template-columns:repeat(2,1fr); } .kpi { padding:10px 12px; } .kpi + .kpi { border-left:none; } .kpi:nth-child(even) { border-left:1px solid rgba(111,151,255,.12); }
      .caps { grid-template-columns:repeat(3,1fr); }
      .ai-hero { grid-template-columns:88px 1fr; }
      .chip.time { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms!important; transition-duration:.001ms!important; } }
  </style>
</head>

  /* ==================== 趋势图（稽核板块）==================== */
  function drawTrend() {
    const cv = $id('trendCv'); if (!cv) return;
    const rect = cv.getBoundingClientRect(); if (rect.width < 10) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(rect.width * dpr); cv.height = Math.round(rect.height * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = rect.width, H = rect.height, pad = { l: 30, r: 12, t: 12, b: 18 };
    ctx.clearRect(0, 0, W, H); ctx.font = '8px system-ui';
    const a = DATA.audit;
    const all = a.trend.concat(a.forecast); const split = a.trend.length - 1;
    const maxV = Math.max.apply(null, all) + 1;
    const dx = (W - pad.l - pad.r) / (all.length - 1);
    const yOf = v => pad.t + (1 - v / maxV) * (H - pad.t - pad.b);
    for (let g = 0; g <= maxV; g++) {
      const y = yOf(g);
      ctx.strokeStyle = 'rgba(111,151,255,.1)'; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
      ctx.fillStyle = '#58668080'; ctx.fillText(String(g), pad.l - 14, y + 3);
    }
    const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
    grad.addColorStop(0, 'rgba(111,151,255,.3)'); grad.addColorStop(1, 'rgba(111,151,255,0)');
    ctx.beginPath(); a.trend.forEach((v, i) => { const x = pad.l + i * dx; i ? ctx.lineTo(x, yOf(v)) : ctx.moveTo(x, yOf(v)); });
    ctx.lineTo(pad.l + split * dx, H - pad.b); ctx.lineTo(pad.l, H - pad.b); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); a.trend.forEach((v, i) => { const x = pad.l + i * dx; i ? ctx.lineTo(x, yOf(v)) : ctx.moveTo(x, yOf(v)); });
    ctx.strokeStyle = '#6f97ff'; ctx.lineWidth = 2; ctx.shadowColor = '#6f97ff'; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
    a.trend.forEach((v, i) => { const x = pad.l + i * dx, y = yOf(v); ctx.fillStyle = '#0a1122'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 7); ctx.fill(); ctx.fillStyle = '#9db5f0'; ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7); ctx.fill(); });
    ctx.setLineDash([5, 4]); ctx.beginPath();
    a.forecast.forEach((v, i) => { const x = pad.l + (split + i) * dx; i ? ctx.lineTo(x, yOf(v)) : ctx.moveTo(x, yOf(v)); });
    ctx.strokeStyle = '#2ee6a8'; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    const sx = pad.l + split * dx;
    ctx.strokeStyle = 'rgba(46,230,168,.4)'; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(sx, pad.t); ctx.lineTo(sx, H - pad.b); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#2ee6a8'; ctx.fillText('现在', sx - 10, H - 5);
    ctx.fillStyle = '#58668080'; ctx.fillText(a.trendHours[0], pad.l, H - 5); ctx.fillText(a.forecastHours[a.forecastHours.length - 1], W - pad.r - 22, H - 5);
  }

  function compressImage(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1000;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) { const k = Math.min(MAX / w, MAX / h); w = Math.round(w * k); h = Math.round(h * k); }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ name: file.name.replace(/\.[^.]+$/, '').slice(0, 18) || '培训照片', src: cv.toDataURL('image/jpeg', 0.72) });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

      if (saved.ai) Object.keys(DEFAULT_AI).forEach(k => { if (saved.ai[k] !== undefined) AI_VIEW[k] = saved.ai[k]; });

  const editState = { def: EDIT_DEFS[0] };

  function fiHtml(label, val, type, attrs) {
    if (type === 'a') return '<label class="fi"><span>' + label + '</span><textarea rows="2" ' + attrs + '>' + esc(val) + '</textarea></label>';
    if (type === 'n') return '<label class="fi"><span>' + label + '</span><input type="number" step="any" ' + attrs + ' value="' + esc(val) + '"></label>';
    if (type && type.indexOf('s:') === 0) {
      const opts = type.slice(2).split('|');
      return '<label class="fi"><span>' + label + '</span><select ' + attrs + '>' + opts.map(o => '<option value="' + o + '"' + (String(o) === String(val) ? ' selected' : '') + '>' + (o === '' ? '默认' : o) + '</option>').join('') + '</select></label>';
    }
    return '<label class="fi"><span>' + label + '</span><input ' + attrs + ' value="' + esc(val) + '"></label>';
  }
  function getByPath(obj, path) {
    let cur = obj;
    path.split('.').forEach(k => { cur = cur == null ? cur : cur[k]; });
    return cur;
  }
  function setByPath(obj, path, val) {
    const keys = path.split('.'); let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) { if (cur == null) return; cur = cur[keys[i]]; }
    if (cur != null) cur[keys[keys.length - 1]] = val;
  }

  function renderEditor() {
    $id('mNav').innerHTML = EDIT_DEFS.map(d =>
      '<button type="button" class="' + (d === editState.def ? 'active' : '') + '" data-def="' + d.id + '">' + d.label + '</button>').join('');
    const form = $id('mForm');
    if (editState.def.id === '_ai') { form.innerHTML = aiFormHtml(); return; }
    if (editState.def.id === '_duty') { form.innerHTML = dutyFormHtml(); return; }
    form.innerHTML = editState.def.groups.map(g => {
      let inner = '';
      if (g.fields && g.fields[0] && g.fields[0].p !== undefined) inner = '<div class="fgrid">' + g.fields.map(fd => {
        if (fd.p.indexOf('__') > 0) {
          const real = fd.p.split('__')[0].replace(/\.$/, '') + (fd.p.endsWith('__trend') ? '.trend' : fd.p.endsWith('__forecast') ? '.forecast' : '.relations');
          const v = getByPath(DATA, real);
          return fiHtml(fd.l, Array.isArray(v) ? v.join(', ') : '', fd.t, 'data-vp="' + fd.p + '"');
        }
        return fiHtml(fd.l, getByPath(DATA, fd.p) == null ? '' : getByPath(DATA, fd.p), fd.t, 'data-p="' + fd.p + '"');
      }).join('') + '</div>';
      if (g.arr) {
        const arr = getByPath(DATA, g.arr) || [];
        inner = '<div class="flist">' + arr.map((item, i) =>
          '<div class="fitem" style="position:relative;" data-arr="' + g.arr + '" data-idx="' + i + '"><div class="ft2">第 ' + (i + 1) + ' 项</div>' +
          '<div class="fgrid">' + g.fields.map(fd => fiHtml(fd.l, item[fd.k] == null ? '' : item[fd.k], fd.t, 'data-k="' + fd.k + '"')).join('') + '</div>' +
          '<button type="button" class="del-item" data-del="' + i + '" title="删除">✕</button></div>').join('') + '</div>' +
          (g.add ? '<button type="button" class="btn" data-addarr="' + g.arr + '">＋ 新增一条</button>' : '');
      }
      if (g.images) {
        const imgs = DATA.training.images || [];
        inner = '<div class="flist">' + (imgs.length ? imgs.map((im, i) =>
          '<div class="fitem" style="position:relative;grid-template-columns:74px 1fr;display:grid;gap:8px;align-items:center;">' +
          '<img src="' + im.src + '" style="width:74px;height:56px;object-fit:cover;border-radius:6px;">' +
          '<div style="min-width:0;"><b style="font-size:11px;">' + esc(im.name) + '</b><div style="color:#58668080;font-size:9px;margin-top:2px;">' + Math.round(im.src.length / 1024) + ' KB</div></div>' +
          '<button type="button" class="del-item" data-delimg="' + i + '" title="删除">✕</button></div>').join('') : '<div style="color:#58668080;font-size:10px;">暂无图片，可在培训台账面板点击“上传照片”。</div>') + '</div>' +
          '<button type="button" class="btn" onclick="pickImages()">＋ 上传图片</button>';
      }
      return '<div class="fgrp"><div class="ft">' + g.t + '</div>' + inner + '</div>';
    }).join('');
  }

  function commitEditor() {
    document.querySelectorAll('#mForm [data-p]').forEach(el => {
      let val = el.value;
      if (el.type === 'number') val = Number(val);
      if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.tagName === 'SELECT') {
        const p = el.getAttribute('data-p');
        if (p.indexOf('DOMAINS.') === 0) { const dd = DOMAINS.find(x => x.id === p.split('.')[1]); if (dd) dd[p.split('.')[2]] = el.type === 'number' ? Number(val) : val; }
        else if (p.indexOf('AI.') === 0) { const parts = p.split('.'); setByPath(AI_VIEW[parts[1]], parts.slice(2).join('.'), el.type === 'number' ? Number(val) : val); }
        else setByPath(DATA, p, el.type === 'number' ? Number(val) : val);
      }
    });
    document.querySelectorAll('#mForm [data-vp]').forEach(el => {
      const vp = el.getAttribute('data-vp');
      const nums = String(el.value).split(/[,，\s]+/).map(Number).filter(n => !isNaN(n));
      if (vp === 'audit.__trend' && nums.length >= 2) DATA.audit.trend = nums;
      if (vp === 'audit.__forecast' && nums.length >= 1) DATA.audit.forecast = nums;
      if (vp === 'audit.__relations') { const arr = String(el.value).split(/[,，]/).map(s => s.trim()).filter(Boolean); if (arr.length >= 2) DATA.audit.relations = arr; }
    });
    const arrGroups = {};
    document.querySelectorAll('#mForm .fitem[data-arr]').forEach(item => {
      const arrPath = item.getAttribute('data-arr');
      if (!arrGroups[arrPath]) arrGroups[arrPath] = [];
      const obj = {};
      item.querySelectorAll('[data-k]').forEach(inp => {
        let v = inp.value; if (inp.type === 'number') v = Number(v);
        obj[inp.getAttribute('data-k')] = v;
      });
      arrGroups[arrPath].push(obj);
    });
    Object.keys(arrGroups).forEach(arrPath => {
      const newArr = arrGroups[arrPath];
      if (arrPath.indexOf('AI.') === 0) { const parts = arrPath.split('.'); AI_VIEW[parts[1]][parts[2]] = newArr; }
      else if (arrPath === 'DUTY') DUTY.splice(0, DUTY.length, newArr);
      else setByPath(DATA, arrPath, newArr);
    });
    DATA.audit.total = DATA.audit.records.length || DATA.audit.total;
    if (DATA.staffing.rate == null) DATA.staffing.rate = Math.round(DATA.staffing.actual / DATA.staffing.total * 100);
  }

  function initEditor() {
    const ovl = $id('editOvl');
    $id('editBtn').addEventListener('click', () => { editState.def = EDIT_DEFS[0]; renderEditor(); ovl.classList.add('open'); if (autoplay) { autoplay = false; syncAp(); } });
    $id('editClose').addEventListener('click', () => ovl.classList.remove('open'));
    ovl.addEventListener('click', e => { if (e.target === ovl) ovl.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') ovl.classList.remove('open'); });
    $id('mNav').addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      commitEditor();
      editState.def = EDIT_DEFS.find(d => d.id === btn.dataset.def) || EDIT_DEFS[0];
      renderEditor();
    });
    $id('mForm').addEventListener('click', e => {
      const del = e.target.closest('[data-del]');
      if (del) { commitEditor(); const box = del.closest('[data-arr]'); const arrPath = box.getAttribute('data-arr'); const arr = arrPath.indexOf('AI.') === 0 ? AI_VIEW[arrPath.split('.')[1]][arrPath.split('.')[2]] : (arrPath === 'DUTY' ? DUTY : getByPath(DATA, arrPath)); arr.splice(Number(del.dataset.del), 1); renderEditor(); return; }
      const delImg = e.target.closest('[data-delimg]');
      if (delImg) { DATA.training.images.splice(Number(delImg.dataset.delimg), 1); renderEditor(); refreshAll(); return; }
      const add = e.target.closest('[data-addarr]');
      if (add) {
        commitEditor();
        const arrPath = add.dataset.addarr;
        const blank = { t: '00:00', r: 'A区', p: '', d: '', k: '', x: '中' };
        const blankSimple = { name: '', value: 0 };
        const blankItem = { title: '', detail: '', status: '进行中', tone: 's-run' };
        if (arrPath === 'DUTY') DUTY.push({ g: '', n: '' });
        else if (arrPath === 'audit.records') DATA.audit.records.push(Object.assign({}, blank));
        else if (arrPath === 'audit.causes') DATA.audit.causes.push({ name: '', value: 0, source: '' });
        else if (arrPath === 'posts.items' || arrPath === 'affairs.items') { const o = Object.assign({}, blankItem); o.name = ''; o.dri = ''; o.tone = 's-run'; (arrPath === 'posts.items' ? DATA.posts.items : DATA.affairs.items).push(o); }
        else if (arrPath === 'projects.key') DATA.projects.key.push({ region: '', nature: '', name: '', stage: '', note: '', spm: '', st: 's-run' });
        else if (arrPath === 'training.topics') DATA.training.topics.push({ name: '', n: 0, trainer: '' });
        else { const arr = getByPath(DATA, arrPath); if (arr && arr.length) { const proto = arr[0]; const o = {}; Object.keys(proto).forEach(k => o[k] = (typeof proto[k] === 'number' ? 0 : '')); arr.push(o); } else if (arr) arr.push(Object.assign({}, blankSimple)); }
        renderEditor();
      }
    });
    $id('editApply').addEventListener('click', () => { commitEditor(); persist(); refreshAll(); renderEditor(); announce('数据已更新，看板已实时刷新'); });
    $id('editReset').addEventListener('click', () => {
      Object.keys(DEFAULT_DATA).forEach(k => DATA[k] = JSON.parse(JSON.stringify(DEFAULT_DATA[k])));
      Object.keys(DEFAULT_AI).forEach(k => AI_VIEW[k] = JSON.parse(JSON.stringify(DEFAULT_AI[k])));
      DUTY.splice(0, DUTY.length, JSON.parse(JSON.stringify(DEFAULT_DUTY)));
      DOMAINS.forEach(d => { const def = JSON.parse(JSON.stringify(d)); d.score = def.score; d.scoreLabel = def.scoreLabel; });
      persist(); refreshAll(); renderEditor(); announce('已恢复默认演示数据');
    });
    $id('editExport').addEventListener('click', () => {
      commitEditor(); persist();
      const payload = JSON.stringify({ data: DATA, ai: AI_VIEW, duty: DUTY, domains: DOMAINS }, null, 1);
      const blob = new Blob([payload], { type: 'application/json' });
      const link = document.createElement('a');
      const now = new Date();
      link.href = URL.createObjectURL(blob);
      link.download = '安保卫士-看板数据-' + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1200);
      announce('数据已导出为 JSON 文件');
    });
    $id('editImport').addEventListener('click', () => $id('importFile').click());
    $id('importFile').addEventListener('change', () => {
      const file = $id('importFile').files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const saved = JSON.parse(reader.result);
          if (!saved.data || !saved.data.audit) throw new Error('JSON 格式不正确');
          Object.keys(DEFAULT_DATA).forEach(k => { if (saved.data[k] !== undefined) DATA[k] = saved.data[k]; });
          if (saved.ai) Object.keys(DEFAULT_AI).forEach(k => { if (saved.ai[k] !== undefined) AI_VIEW[k] = saved.ai[k]; });
          if (saved.duty) DUTY.splice(0, DUTY.length, saved.duty);
          if (saved.domains) saved.domains.forEach(sd => { const d = DOMAINS.find(x => x.id === sd.id); if (d) { d.score = sd.score; d.scoreLabel = sd.scoreLabel; } });
          persist(); refreshAll(); renderEditor(); announce('数据导入成功，看板已刷新');
        } catch (err) { announce('导入失败：' + err.message); }
        $id('importFile').value = '';
      };
      reader.readAsText(file, 'utf-8');
    });
  }

  /* ==================== 云端同步（在线版）==================== */
  const DATA_URL = './data.json';
  let cloudHash = '';
  function applyCloud(payload) {
    try {
      if (payload.data) Object.keys(DEFAULT_DATA).forEach(k => { if (payload.data[k] !== undefined) DATA[k] = payload.data[k]; });
      if (payload.ai) Object.keys(DEFAULT_AI).forEach(k => { if (payload.ai[k] !== undefined) AI_VIEW[k] = payload.ai[k]; });
      if (payload.duty) DUTY.splice(0, DUTY.length, payload.duty);
    } catch (e) { console.warn('云端数据应用失败', e); }
  }
  async function fetchCloud(silent) {
    try {
      const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const txt = await r.text();
      const payload = JSON.parse(txt);
      const h = txt.length + ':' + (payload.savedAt || '');
      $id('cloudChip').textContent = '☁ 云端已连接';
      $id('cloudChip').style.color = '#3ddc97';
      if (h !== cloudHash) {
        const first = !cloudHash;
        cloudHash = h;
        applyCloud(payload);
        refreshAll();
        if (!first && !silent) announce('云端数据已更新，看板已刷新');
      }
      return true;
    } catch (e) {
      // file:// 或未部署 data.json 时为本地模式
      if (!cloudHash) { $id('cloudChip').textContent = '☁ 本地模式'; $id('cloudChip').style.color = ''; }
      return false;
    }
  }
  function initCloud() {
    fetchCloud(true);            // 首次加载：云端优先
    setInterval(() => fetchCloud(false), 60000);  // 每 60 秒检查更新
  }
  window.__EXPORT_DATA = () => JSON.stringify({ data: DATA, ai: AI_VIEW, duty: DUTY }, null, 1);

  /* ---- 一键发布到 GitHub（免手动改 JSON）---- */
  const CLOUD_CFG_KEY = 'aww-cloud-cfg';
  function loadCloudCfg() {
    try { return JSON.parse(localStorage.getItem(CLOUD_CFG_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function saveCloudCfg(cfg) { try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }
  async function publishToGitHub() {
    const cfg = loadCloudCfg();
    if (!cfg.token || !cfg.repo) { announce('请先在「云端发布设置」中填写 Token 和仓库'); openCloudCfg(); return; }
    announce('正在发布到云端…');
    try {
      const api = 'https://api.github.com/repos/' + cfg.repo + '/contents/data.json';
      let sha = null;
      try {
        const r = await fetch(api, { headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' } });
        if (r.ok) sha = (await r.json()).sha;
      } catch (e) {}
      const body = JSON.stringify({
        message: '更新看板数据 ' + new Date().toLocaleString('zh-CN'),
        content: btoa(unescape(encodeURIComponent(window.__EXPORT_DATA()))),
        sha: sha || undefined
      });
      const put = await fetch(api, {
        method: 'PUT',
        headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: body
      });
      if (!put.ok) {
        const err = await put.json().catch(() => ({}));
        throw new Error(err.message || put.status);
      }
      cloudHash = '';
      announce('发布成功！所有访问者约 1 分钟内自动更新');
    } catch (e) {
      announce('发布失败：' + (e.message || '网络错误') + '，请检查 Token 权限');
    }
  }
  function openCloudCfg() {
    const cfg = loadCloudCfg();
    const saved = '<div style="color:#3ddc97">已保存</div>';
    const html2 =
      '<div style="position:fixed;inset:0;background:rgba(5,7,16,.75);z-index:99;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)this.remove()">' +
      '<div style="width:min(520px,92vw);background:#101428;border:1px solid #2a3358;border-radius:14px;padding:22px">' +
      '<h3 style="font-size:14px;margin-bottom:6px">☁ 云端发布设置（一次性配置）</h3>' +
      '<div style="font-size:10.5px;color:#8291b3;line-height:1.7;margin-bottom:12px">填入 GitHub 令牌后，你在数据维护中心改完数据点「发布到云端」即可，无需再手动编辑 JSON。令牌只保存在你这台电脑的浏览器里。</div>' +
      '<div style="margin-bottom:10px"><label style="font-size:10px;color:#8291b3;display:block;margin-bottom:3px">仓库（owner/repo，如 Lyra0224/security-board）</label>' +
      '<input id="cfgRepo" type="text" value="' + (cfg.repo || '') + '" style="width:100%;background:rgba(255,255,255,.04);border:1px solid #242c4e;border-radius:7px;padding:7px 10px;color:#dde5f5;font-size:12px"></div>' +
      '<div style="margin-bottom:14px"><label style="font-size:10px;color:#8291b3;display:block;margin-bottom:3px">GitHub 令牌（Personal Access Token，需 Contents 读写权限）</label>' +
      '<input id="cfgToken" type="password" placeholder="github_pat_ 开头" style="width:100%;background:rgba(255,255,255,.04);border:1px solid #242c4e;border-radius:7px;padding:7px 10px;color:#dde5f5;font-size:12px"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button id="cfgCancel" class="btn" type="button" style="padding:6px 16px;border-radius:8px;border:1px solid #242c4e;background:none;color:#8291b3;cursor:pointer;font-size:12px">取消</button>' +
      '<button id="cfgSave" type="button" style="padding:6px 16px;border-radius:8px;border:1px solid rgba(61,220,151,.5);background:rgba(61,220,151,.12);color:#c9ffe9;cursor:pointer;font-size:12px">保存设置</button></div>' +
      '</div></div>';
    const wrap = document.createElement('div');
    wrap.innerHTML = html2;
    document.body.appendChild(wrap.firstElementChild);
    const box = document.body.lastElementChild;
    box.querySelector('#cfgCancel').onclick = () => box.remove();
    box.querySelector('#cfgSave').onclick = () => {
      saveCloudCfg({ repo: box.querySelector('#cfgRepo').value.trim(), token: box.querySelector('#cfgToken').value.trim() });
      box.remove(); announce('云端发布设置已保存');
    };
  }

  /* ==================== 初始化 ==================== */
  $id('cloudPublish').addEventListener('click', publishToGitHub);

  function init() {
    loadSaved();
    initCloud();
    renderTabs(); renderNav(); renderKpis(); renderMain(); renderAiColumn(); renderClosure(); renderCaps(0);
    initCrawl(); initEditor();
    tickClock(); setInterval(tickClock, 1000);
    setInterval(() => { if (autoplay) { const idx = DOMAINS.findIndex(d => d.id === currentDomain); switchDomain(DOMAINS[(idx + 1) % DOMAINS.length].id, false); } }, 12000);
    $id('apBtn').addEventListener('click', () => { autoplay = !autoplay; syncAp(); announce(autoplay ? '自动轮播已继续（每 12 秒切换板块）' : '自动轮播已暂停，可用 ←/→ 切换'); });
    document.addEventListener('keydown', e => {
      if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(document.activeElement.tagName) >= 0) return;
      const idx = DOMAINS.findIndex(d => d.id === currentDomain);
      if (e.key === 'ArrowRight') { e.preventDefault(); switchDomain(DOMAINS[(idx + 1) % DOMAINS.length].id, true); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); switchDomain(DOMAINS[(idx - 1 + DOMAINS.length) % DOMAINS.length].id, true); }
      if (e.code === 'Space') { e.preventDefault(); $id('apBtn').click(); }
    });
    window.addEventListener('resize', () => requestAnimationFrame(drawTrend));
    $id('imgFile').addEventListener('change', async () => {
      const files = Array.from($id('imgFile').files); if (!files.length) return;
      announce('正在处理 ' + files.length + ' 张照片…');
      for (const file of files) { DATA.training.images.push(await compressImage(file)); }
      $id('imgFile').value = '';
      persist(); refreshAll();
      announce('已上传 ' + files.length + ' 张培训照片');
    });
    syncAp();
  }
  init();
  </script>
